# checkmake config for this repo.
#
# phonydeclared is disabled: it flags any target with no recipe body as
# "should be declared PHONY", but src/keywords$(OBJ_EXT) is a legitimate
# dependency-only rule that adds extra prerequisites (src/keywords.h,
# src/keyword_ids.h) to a target whose actual recipe comes from the
# %$(OBJ_EXT): %.c pattern rule further down -- a standard Make idiom.
# It produces a real file and must never be marked PHONY (that would
# force it to rebuild on every invocation). checkmake's Rule.Body check
# only sees this rule's own (empty) recipe list, not the pattern rule
# that actually builds it, so it can't tell this apart from a genuinely
# phony target -- see https://github.com/checkmake/checkmake upstream
# issue (no per-target exemption exists in this rule; see its Run()
# in rules/phonydeclared/phonydeclared.go).
[phonydeclared]
disabled = true
