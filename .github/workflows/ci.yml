name: CI
on: [push, pull_request]

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc build-essential libc6-dev cppcheck
          cd tinycc && ./configure && make && sudo make install
          pip install prek

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install gcc coreutils
          cd tinycc && ./configure && make && sudo make install

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gdb
            make
            curl
            unzip
            perl

      - name: Disable Windows Error Reporting UI
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Prevent a crashing test binary from hanging the job on a WER
          # "program has stopped working" dialog with nobody to dismiss it
          # -- force crashes to fail fast with their real exit code instead.
          reg add "HKCU\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v DontShowUI /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f

      - name: Build and install TinyCC (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          cd tinycc
          ./configure
          make
          make install

      - name: Build
        run: make

      - name: Smoke test (macOS) - diagnose
        if: matrix.os == 'macos-latest'
        run: |
          printf '#include <stdio.h>\nint main(){printf("ok\\n");return 0;}\n' > /tmp/smoke_diag.c
          echo "=== compile-only (exercises macho_write.c) ==="
          ./rcc -c -o /tmp/smoke_diag.o /tmp/smoke_diag.c
          echo "compile exit=$?"
          echo "--- otool -hv (mach header) ---"
          otool -hv /tmp/smoke_diag.o || true
          echo "--- otool -lv (load commands) ---"
          otool -lv /tmp/smoke_diag.o || true
          echo "--- otool -tv (disassembly) ---"
          otool -tv /tmp/smoke_diag.o || true
          echo "=== link-only (exercises link_macho.c) under lldb ==="
          lldb -b -o run -o bt -o quit -- ./rcc -o /tmp/smoke_diag /tmp/smoke_diag.o 2>&1 || true
          echo "--- otool -hv on linked executable (if produced) ---"
          test -f /tmp/smoke_diag && otool -hv /tmp/smoke_diag || echo "(no executable produced)"
          rm -f /tmp/smoke_diag.c /tmp/smoke_diag.o /tmp/smoke_diag

      - name: Smoke test (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          printf '#include <stdio.h>\nint main(){printf("ok\\n");return 0;}\n' > /tmp/smoke.c
          ./rcc -o /tmp/smoke /tmp/smoke.c
          /tmp/smoke
          printf '#include <stdlib.h>\nint main(){void *p=malloc(8);free(p);return p?0:1;}\n' > /tmp/smoke2.c
          ./rcc -o /tmp/smoke2 /tmp/smoke2.c
          /tmp/smoke2
          rm -f /tmp/smoke /tmp/smoke.c /tmp/smoke2 /tmp/smoke2.c

      - name: Smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          printf '#include <stdio.h>\nint main(){printf("ok\\n");return 0;}\n' > /tmp/smoke.c
          ./rcc -o /tmp/smoke /tmp/smoke.c
          /tmp/smoke
          printf '#include <stdlib.h>\nint main(){void *p=malloc(8);free(p);return p?0:1;}\n' > /tmp/smoke2.c
          ./rcc -o /tmp/smoke2 /tmp/smoke2.c
          /tmp/smoke2
          rm -f /tmp/smoke /tmp/smoke.c /tmp/smoke2 /tmp/smoke2.c

      - name: Smoke test (Windows) - compile
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          printf '#include <stdio.h>\nint main(){printf("ok\\n");return 0;}\n' > smoke.c
          ./rcc.exe -o smoke.exe smoke.c
          printf '#include <stdlib.h>\nint main(){void *p=malloc(8);free(p);return p?0:1;}\n' > smoke2.c
          ./rcc.exe -o smoke2.exe smoke2.c

      - name: Smoke test (Windows) - run
        if: matrix.os == 'windows-latest'
        timeout-minutes: 2
        shell: pwsh
        run: |
          & .\smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "smoke.exe failed with exit code $LASTEXITCODE" }
          & .\smoke2.exe
          if ($LASTEXITCODE -ne 0) { throw "smoke2.exe failed with exit code $LASTEXITCODE" }
          Remove-Item -Force smoke.exe, smoke.c, smoke2.exe, smoke2.c

      - name: Run tests
        id: tests
        shell: bash
        run: |
          ./rcc --version
          FAIL=
          make check || FAIL=1
          make test-torture || FAIL=1
          test -z "$FAIL"

      # Shell-driven link tests, incl. the Windows-specific cases
      # (DLL + --out-implib import library): the Makefile's LINK_TEST
      # gate skips them on EXE_EXT builds, so run the script directly.
      - name: Link tests (Windows) - DLL + import lib
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        timeout-minutes: 10
        run: ./test/test-link.sh ./rcc.exe

      - name: Check for source, bench or test changes
        id: changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            sources:
              - 'test/**'
              - 'src/**'
              - 'bench/**'
              - 'run_tests.c'

      - name: Run benchmarks
        if: steps.changed.outputs.sources == 'true'
        run: make bench

      - name: Upload Windows reports
        if: ${{ matrix.os == 'windows-latest' && steps.changed.outputs.sources == 'true' && (success() || failure()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-reports
          path: |
            bench/bench_report_mingw.md
            test/tcc_test_mingw.md
            test/torture_report_mingw.log
            test_report_mingw.md

      - name: Upload macOS reports
        if: ${{ matrix.os == 'macos-latest' && steps.changed.outputs.sources == 'true' && (success() || failure()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-reports
          path: |
            bench/bench_report_darwin.md
            test/tcc_test_arm64.md
            test/torture_report_arm64.log
            test_report_arm64.md

      - name: Upload Linux reports
        if: ${{ matrix.os == 'ubuntu-latest' && steps.changed.outputs.sources == 'true' && (success() || failure()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-reports
          path: |
            bench/bench_report_linux.md
            test/tcc_test_linux.md
            test/torture_report_linux.log
            test_report_linux.md

      - name: Check test result
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Tests failed — see uploaded artifacts for details"
          exit 1

      - name: Make dist
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dist'
        run: |
          git reset --hard
          make dist

      - name: Upload Windows dist
        if: matrix.os == 'windows-latest' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dist')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rcc-windows
          path: |
            rcc-*.zip

      - if: startsWith(github.ref, 'refs/tags/') && github.ref == 'refs/heads/main'
        name: Release
        continue-on-error: true
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
              rcc-*.tar.gz
              rcc-*.tar.xz
              rcc-*.zip

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc build-essential libc6-dev cppcheck
          pip install prek

      - name: Install checkmake
        env:
          # Keep in sync with the checkmake/checkmake rev in
          # .pre-commit-config.yaml. There's no apt/pip package; install
          # the goreleaser-built binary from the pinned GitHub release,
          # verified against its published checksum.
          CHECKMAKE_VERSION: v0.3.2
        run: |
          asset="checkmake-${CHECKMAKE_VERSION}.linux.amd64"
          base="https://github.com/checkmake/checkmake/releases/download/${CHECKMAKE_VERSION}"
          curl -sSLO "$base/$asset"
          curl -sSLO "$base/checksums.txt"
          grep "$asset" checksums.txt | sed 's#\.release_artifacts/##' | sha256sum -c -
          chmod +x "$asset"
          sudo mv "$asset" /usr/local/bin/checkmake
          rm -f checksums.txt
          checkmake --version

      - name: Build
        run: make

      - name: Run lint
        run: make lint-changed
